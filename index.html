<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title> Fonepay - QR Generator </title>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/  jsQR.js"></script>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_copy" />

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
      background: #f3f5fb;
      color: #172033
    }

    section {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px
    }

    input,
    button {
      box-sizing: border-box;
      max-width: 100%;
      padding: 10px;
      margin: 7px 0
    }

    input[type=text],
    input[type=file] {
      width: 100%
    }

    button {
      background: #1b2cc1;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer
    }

    #qrwrap {
      position: relative;
      width: 280px;
      max-width: 100%;
      aspect-ratio: 1;
      margin: 20px auto
    }

    #qrimg {
      width: 100%;
      height: 100%;
      display: block
    }

    #logoimg {
      position: absolute;
      width: 17%;
      height: 17%;
      object-fit: contain;
      background: white;
      padding: 2%;
      border-radius: 5px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%)
    }

    #decoded {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #eef1ff;
      padding: 12px;
      border-radius: 6px;
    }

    #qrsource {
      position: absolute;
      left: -9999px
    }

    #copy {
      position: relative;
    }

    #copy>button {
      background-color: grey;
      padding: 2px 6px;
      position: absolute;
      right: 5px;
      top: 0;
    }
  </style>
</head>

<body>

  <h1>Fonepay QR Generator</h1>

  <section>
    <h2>Generate QR Code</h2>
    <form action="GET" id="qr-genrate-form">
      <label for="">Terminal id:</label>
      <input type="text" id="terminal_id" placeholder="Enter Your Terminal id" required>
      <label for="amount">Amount(RS):</label>
      <input type="text" id="amount" placeholder="Enter Amount(optional)">
      <label for="remark">Remark:</label>
      <input type="text" id="remark" placeholder="Enter Remark(optional)">
      <button id="generate">Generate QR</button>
    </form>

    <div id="qrimg"></div>

    <button id="download" hidden>Download QR Image</button>
    <div id="qrsource"></div>
  </section>

  <script>
    const $ = id => document.getElementById(id);

    // Generate Fonepay QR
    $("qr-genrate-form").addEventListener("submit", (e) => {
      e.preventDefault()
      if ($("terminal_id").value.length == 16) {
        if ($("qrimg").querySelector("img")) {
          let img = $("qrimg").querySelector("img")
          let canvas = $("qrimg").querySelector("canvas")
          img.remove()
          canvas.remove()
        }
        $("download").hidden = false
        const Terminal_id = $("terminal_id").value;
        const Amount_L = String($("amount").value.length).padStart(2, "0");
        const Amount = $("amount").value;
        const Remark_L = String($("remark").value.length).padStart(2, "0");
        const Remark = $("remark").value;
        console.log(Remark);
        const Aditional_info_L = 25 + parseInt(Remark.length) + parseInt(Remark_L)
        console.log(Aditional_info_L);


        let text = `00020101021226460011fonepay.com060718808380716${Terminal_id}520473115303524${Amount ? "54" + Amount_L : ''}${Amount ? Amount : ''}5802NP62${Aditional_info_L}01089255464407072048372${Remark ? "08" + Remark_L : ''}${Remark ? Remark : ''}63046b50`;
        console.log(text);
        let qrcode = new QRCode($("qrimg"), {
          text: text,
          width: 200,
          height: 200
        })
      }
    })

    // Download QR

    $("download").addEventListener("click", () => {
      const img = document.querySelector("img");
      console.log(img);
      const link = document.createElement("a");
      link.href = img.src;
      link.download = "qr.png";
      link.click();
    })
    $("terminal_id").addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 16);
    })
    $("amount").addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/[^0-9.]/g, '').slice(0, 10);
    })
    const express = require('express');
    const app = express();

    // Middleware to parse incoming JSON request bodies
    app.use(express.json());

    app.post('/your-endpoint-url', (req, res) => {
      // 1. Get the value sent from the front-end fetch body
      const sentValue = req.body.value;

      // 2. Generate a random ID between 1 and 999
      const randomId = Math.floor(Math.random() * 999) + 1;

      // 3. Send the exact response format back
      res.json({
        id: randomId.toString(),
        value: sentValue
      });
    });

    app.listen(3000, () => console.log('Server running on port 3000'));

  </script>

</body>

</html>
