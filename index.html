<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM Notification</title>
</head>

<body>
    <h2>Firebase Push Notification</h2>
    <button id="enable">Enable Notifications</button>
    <button id="copy">Copy Token</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import {
            getMessaging,
            getToken,
            isSupported
        } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-messaging.js";

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyCXGgicr5SNs-Fk03x_bdoY5UAy7cis8bU",
            authDomain: "e-comorse.firebaseapp.com",
            databaseURL: "https://e-comorse-default-rtdb.firebaseio.com",
            projectId: "e-comorse",
            storageBucket: "e-comorse.firebasestorage.app",
            messagingSenderId: "845116043257",
            appId: "1:845116043257:web:b6e0500c26826a40639728",
            measurementId: "G-32X5E5N6ET"
        };

        const vapidKey = "BDajL6OrcntuJQiUOBIEO-IsYsukFlRb1AcjpPyiks5KVJyNOvQnp-xRBAnd_OaUD0fWazjLDhkCjTjXS51TxrA";

        const app = initializeApp(firebaseConfig);

        document.getElementById("enable").addEventListener("click", async () => {
            try {
                if (!("Notification" in window)) {
                    throw new Error("Notifications are not supported.");
                }

                if (!(await isSupported())) {
                    throw new Error("Firebase Messaging is not supported.");
                }

                const permission = await Notification.requestPermission();

                if (permission !== "granted") {
                    throw new Error("Notification permission denied.");
                }

                const registration = await navigator.serviceWorker.register("/firebase-messaging-sw.js");

                const messaging = getMessaging(app);

                const token = await getToken(messaging, {
                    vapidKey
                });

                if (!token) {
                    throw new Error("FCM token was not generated.");
                }

                console.log("FCM Token:", token);

                // TODO: Save this token securely to Firestore.
                alert("Notifications enabled successfully!");

            } catch (error) {
                console.error("FCM Error:", error);
                alert(error.message);
            }
        });
        document.getElementById("copy").addEventListener("click", async () => {
            try {
                const messaging = getMessaging(app);
                const token = await getToken(messaging, { vapidKey });

                if (!token) {
                    throw new Error("FCM token was not generated.");
                }

                await navigator.clipboard.writeText(token);
                alert("Token copied to clipboard!");
            } catch (error) {
                console.error("Copy Token Error:", error);
                alert(error.message);
            }
        });
    </script>
</body>

</html>
